const grid=document.getElementById('grid');const opened=new Set();
let toastTimer;function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
function update(){document.getElementById('count').textContent=opened.size;document.getElementById('progress').style.width=opened.size+'%';if(opened.size===100)toast('All 100 hearts opened. I love you ♡')}
function setOpen(n,yes){const el=document.getElementById('reason-'+n);if(yes){opened.add(n);el.classList.add('revealed');el.setAttribute('aria-pressed','true');el.setAttribute('aria-label','Reason '+n+': '+reasons[n-1])}else{opened.delete(n);el.classList.remove('revealed');el.setAttribute('aria-pressed','false');el.setAttribute('aria-label','Reveal reason '+n)}update()}
reasons.forEach((reason,i)=>{const n=i+1;const btn=document.createElement('button');btn.id='reason-'+n;btn.type='button';btn.className='reason'+(n===100?' special':'');btn.setAttribute('aria-pressed','false');btn.setAttribute('aria-label','Reveal reason '+n);const front=document.createElement('span');front.className='front';front.innerHTML='<span class="number">REASON '+String(n).padStart(2,'0')+'</span><span class="heart" aria-hidden="true">♡</span><span class="hint">Tap to reveal</span>';const back=document.createElement('span');back.className='back';const num=document.createElement('span');num.className='number';num.textContent='REASON '+String(n).padStart(2,'0');const words=document.createElement('span');words.className='words';words.textContent=reason;const tiny=document.createElement('span');tiny.className='tinyheart';tiny.textContent='♥';back.append(num,words,tiny);btn.append(front,back);btn.addEventListener('click',()=>setOpen(n,!opened.has(n)));grid.appendChild(btn)});
document.getElementById('start').addEventListener('click',()=>document.getElementById('reasons').scrollIntoView({behavior:'smooth'}));
document.getElementById('surprise').addEventListener('click',()=>{const available=reasons.map((_,i)=>i+1).filter(n=>!opened.has(n)&&n!==100);const pool=available.length?available:(opened.has(100)?[]:[100]);if(!pool.length){toast('You’ve opened every heart ♡');return}const n=pool[Math.floor(Math.random()*pool.length)];setOpen(n,true);document.getElementById('reason-'+n).scrollIntoView({behavior:'smooth',block:'center'})});
document.getElementById('all').addEventListener('click',()=>{for(let i=1;i<=100;i++){opened.add(i);const el=document.getElementById('reason-'+i);el.classList.add('revealed');el.setAttribute('aria-pressed','true');el.setAttribute('aria-label','Reason '+i+': '+reasons[i-1])}update()});
document.getElementById('reset').addEventListener('click',()=>{for(let i=1;i<=100;i++){const el=document.getElementById('reason-'+i);el.classList.remove('revealed');el.setAttribute('aria-pressed','false');el.setAttribute('aria-label','Reveal reason '+i)}opened.clear();update();document.getElementById('reasons').scrollIntoView({behavior:'smooth'})});
